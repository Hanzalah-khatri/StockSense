[project]
name = "stocksense"
version = "1.0.0"
description = "AI-powered stock market analysis and prediction application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.0.3",
    "gunicorn==23.0.0",
    "joblib==1.6.0",
    "numpy==2.4.6",
    "numba==0.67.0",
    "llvmlite==0.49.0",
    "pandas==2.2.2",
    "plotly==5.22.0",
    "scikit-learn==1.5.1",
    "scipy==1.17.1",
    "shap==0.52.0",
    "yfinance==1.7.0"
]

[tool.vercel]
entrypoint = "app:app"